<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 390" role="img" aria-labelledby="title desc">
  <title id="title">Animated pink ASCII butterfly and floral vines</title>
  <desc id="desc">A centered ASCII butterfly framed by wide flowing floral ornaments and twinkling stars.</desc>
  <style>
    :root { color-scheme: dark; }
    .canvas { fill: #08080b; }
    .ink { fill: #f4b8cf; }
    .soft { fill: #ffd9e8; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; white-space: pre; }
    .draw { opacity: 0; animation: reveal 650ms cubic-bezier(.2,.8,.2,1) forwards; }
    .twinkle { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { 0%, 18%, 100% { opacity: .18; transform: scale(.8); } 42%, 70% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .draw, .twinkle { opacity: 1; animation: none; transform: none; } }
  </style>
  <rect class="canvas" width="1600" height="390" rx="18"/>

  <!-- Left flowering vine: open and flowing rather than circular -->
  <g class="ink" font-size="15">
    <text class="draw" x="18" y="40" style="animation-delay:.05s">···</text>
    <text class="draw" x="76" y="61" style="animation-delay:.12s">             ..::····::..</text>
    <text class="draw" x="76" y="80" style="animation-delay:.19s">         .::'    ··     `::..</text>
    <text class="draw" x="76" y="99" style="animation-delay:.26s">      .:'    ..::''::..      `:..</text>
    <text class="draw" x="76" y="118" style="animation-delay:.33s">  ·─::'   .:'        `::.       `::··─·</text>
    <text class="draw" x="76" y="137" style="animation-delay:.40s">    `::.  ::    ··      `:.   ..:'</text>
    <text class="draw" x="76" y="156" style="animation-delay:.47s">       `::.`::.       ..::' .:'      ..::··</text>
    <text class="draw" x="76" y="175" style="animation-delay:.54s">           `::..::::::'  ..:'   ..::'</text>
    <text class="draw" x="76" y="194" style="animation-delay:.61s">              `:..    .:'   ..:'</text>
    <text class="draw" x="76" y="213" style="animation-delay:.68s">                 `::.:'  ..:'</text>
    <text class="draw" x="76" y="232" style="animation-delay:.75s">                    ::..:'</text>
    <text class="draw" x="76" y="251" style="animation-delay:.82s">                    `::.</text>
    <text class="draw" x="76" y="270" style="animation-delay:.89s">                       `::.     ..::··</text>
    <text class="draw" x="76" y="289" style="animation-delay:.96s">                          `::..::'</text>
    <text class="draw" x="76" y="308" style="animation-delay:1.03s">                              `::.  ·</text>
    <text class="draw" x="76" y="327" style="animation-delay:1.10s">                                `::..</text>
    <text class="draw" x="76" y="346" style="animation-delay:1.17s">                                    `··</text>
    <text class="draw" x="598" y="108" style="animation-delay:.78s">··::───·</text>
    <text class="draw" x="572" y="132" style="animation-delay:.86s">.:'  ✦</text>
    <text class="draw" x="608" y="156" style="animation-delay:.94s">`::··</text>
  </g>

  <!-- Mirrored right flowering vine -->
  <g transform="translate(1600 0) scale(-1 1)" class="ink" font-size="15">
    <text class="draw" x="18" y="40" style="animation-delay:.05s">···</text>
    <text class="draw" x="76" y="61" style="animation-delay:.12s">             ..::····::..</text>
    <text class="draw" x="76" y="80" style="animation-delay:.19s">         .::'    ··     `::..</text>
    <text class="draw" x="76" y="99" style="animation-delay:.26s">      .:'    ..::''::..      `:..</text>
    <text class="draw" x="76" y="118" style="animation-delay:.33s">  ·─::'   .:'        `::.       `::··─·</text>
    <text class="draw" x="76" y="137" style="animation-delay:.40s">    `::.  ::    ··      `:.   ..:'</text>
    <text class="draw" x="76" y="156" style="animation-delay:.47s">       `::.`::.       ..::' .:'      ..::··</text>
    <text class="draw" x="76" y="175" style="animation-delay:.54s">           `::..::::::'  ..:'   ..::'</text>
    <text class="draw" x="76" y="194" style="animation-delay:.61s">              `:..    .:'   ..:'</text>
    <text class="draw" x="76" y="213" style="animation-delay:.68s">                 `::.:'  ..:'</text>
    <text class="draw" x="76" y="232" style="animation-delay:.75s">                    ::..:'</text>
    <text class="draw" x="76" y="251" style="animation-delay:.82s">                    `::.</text>
    <text class="draw" x="76" y="270" style="animation-delay:.89s">                       `::.     ..::··</text>
    <text class="draw" x="76" y="289" style="animation-delay:.96s">                          `::..::'</text>
    <text class="draw" x="76" y="308" style="animation-delay:1.03s">                              `::.  ·</text>
    <text class="draw" x="76" y="327" style="animation-delay:1.10s">                                `::..</text>
    <text class="draw" x="76" y="346" style="animation-delay:1.17s">                                    `··</text>
    <text class="draw" x="598" y="108" style="animation-delay:.78s">··::───·</text>
    <text class="draw" x="572" y="132" style="animation-delay:.86s">.:'  ✦</text>
    <text class="draw" x="608" y="156" style="animation-delay:.94s">`::··</text>
  </g>

  <!-- Center butterfly -->
  <g class="ink" font-size="17" text-anchor="middle">
    <text class="draw" x="800" y="75" style="animation-delay:1.02s">.==-.                   .-==.</text>
    <text class="draw" x="800" y="98" style="animation-delay:1.14s">\()8`-._  `.   .'  _.-'8()/</text>
    <text class="draw" x="800" y="121" style="animation-delay:1.26s">(88&quot;   ::.  \./  .::   &quot;88)</text>
    <text class="draw" x="800" y="144" style="animation-delay:1.38s">\_.'`-::::.(#).::::-'`._/</text>
    <text class="draw" x="800" y="167" style="animation-delay:1.50s">`._... .q(_)p. ..._.'</text>
    <text class="draw" x="800" y="190" style="animation-delay:1.62s">&quot;&quot;-..-'|=|`-..-&quot;&quot;</text>
    <text class="draw" x="800" y="213" style="animation-delay:1.74s">.&quot;&quot;' .'|=|`. `&quot;&quot;.</text>
    <text class="draw" x="800" y="236" style="animation-delay:1.86s">,':8(o)./|=|\.(o)8:`.</text>
    <text class="draw" x="800" y="259" style="animation-delay:1.98s">(O :8 ::/ \_/ \:: 8: O)</text>
    <text class="draw" x="800" y="282" style="animation-delay:2.10s">\O `::/       \::' O/</text>
    <text class="draw" x="800" y="305" style="animation-delay:2.22s">&quot;&quot;--'         `--&quot;&quot;</text>
  </g>

  <!-- Irregular stars -->
  <g class="soft" font-size="17">
    <text class="twinkle" x="515" y="57" style="animation-delay:.3s">✦</text>
    <text class="twinkle" x="620" y="245" style="animation-delay:1.1s">⋆</text>
    <text class="twinkle" x="466" y="312" style="animation-delay:2s">✧</text>
    <text class="twinkle" x="675" y="350" style="animation-delay:.7s">·  ✦</text>
    <text class="twinkle" x="1058" y="53" style="animation-delay:1.8s">⋆</text>
    <text class="twinkle" x="974" y="128" style="animation-delay:.5s">✦  ·</text>
    <text class="twinkle" x="1104" y="274" style="animation-delay:2.4s">✧</text>
    <text class="twinkle" x="925" y="345" style="animation-delay:1.3s">⋆  ✦</text>
    <text class="twinkle" x="731" y="42" style="animation-delay:2.2s">·</text>
    <text class="twinkle" x="864" y="327" style="animation-delay:.9s">·</text>
    <text class="twinkle" x="350" y="210" style="animation-delay:1.6s">✦</text>
    <text class="twinkle" x="1248" y="196" style="animation-delay:.6s">⋆</text>
  </g>
  <text class="draw soft" x="800" y="365" text-anchor="middle" font-size="13" letter-spacing="6" style="animation-delay:2.48s">✦  CREATE · CODE · CURIOUS  ✦</text>
</svg>
