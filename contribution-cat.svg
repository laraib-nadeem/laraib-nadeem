<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 175" role="img" aria-labelledby="title desc">
  <title id="title">Chubby cat watching Laraib's contributions</title>
  <desc id="desc">A white ASCII-style cat rests its paws above the contribution graph with pink stars.</desc>

  <style>
    .cat { fill: #fff7fb; }
    .pink { fill: #f4b8cf; }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      white-space: pre;
    }
  </style>

  <g class="pink" font-size="18">
    <text x="220" y="54">✦　·　⋆</text>
    <text x="900" y="48">⋆　·　✦</text>
    <text x="325" y="124">·</text>
    <text x="860" y="132">✧</text>
  </g>

  <g class="cat" text-anchor="middle" font-size="20">
    <text x="600" y="27">/\_____/\</text>
    <text x="600" y="51">/  o   o  \</text>
    <text x="600" y="75">( ==  ^  == )</text>
    <text x="600" y="99">)         (</text>
    <text x="600" y="123">(           )</text>
    <text x="600" y="147">( (  )   (  ) )</text>
    <text x="600" y="171">(__(__)___(__)__)</text>
  </g>
</svg>
