<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" role="img" aria-labelledby="title desc">
  <title id="title">Cat pointing to Laraib's résumé</title>
  <desc id="desc">A white text-art cat points toward a large pink résumé button.</desc>

  <!-- White ASCII-style cat -->
  <g fill="#fff7fb" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="22" text-anchor="middle">
    <text x="125" y="37">/\_____/\</text>
    <text x="125" y="63">/  o   o  \</text>
    <text x="125" y="89">( ==  ^  == )</text>
    <text x="125" y="115">(__)___(__)</text>
  </g>

  <!-- Extended paw and pointer spark -->
  <path d="M176 91 C205 88 221 83 247 79" fill="none" stroke="#fff7fb"
        stroke-width="6" stroke-linecap="round"/>
  <circle cx="250" cy="78" r="7" fill="#fff7fb"/>
  <path d="M270 78h29M284 64v28" stroke="#ffd9e8" stroke-width="4" stroke-linecap="round"/>

  <!-- Main button -->
  <rect x="318" y="24" width="658" height="122" rx="28"
        fill="#f4b8cf" stroke="#ffd9e8" stroke-width="5"/>

  <!-- Document icon -->
  <g fill="none" stroke="#08080b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M365 52h34l18 18v48h-52z"/>
    <path d="M399 52v19h18M378 88h25M378 101h25"/>
  </g>

  <text x="690" y="96" fill="#08080b" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="36" font-weight="750" letter-spacing=".5">Explore my résumé</text>
</svg>
