<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Laraib profile status card with a chubby cat</title>
  <desc id="desc">A black ASCII cat sits above a pink card describing Laraib's interests.</desc>

  <style>
    .card { fill: #f4b8cf; }
    .ink { fill: #08080b; }
    .cat { fill: #fff7fb; }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      white-space: pre;
    }
  </style>

  <rect class="card" x="20" y="108" width="1160" height="258" rx="22"/>

  <!-- Chubby cat perched on the card -->
  <g class="cat" text-anchor="middle" font-size="19">
    <text x="600" y="28">/\_____/\</text>
    <text x="600" y="50">/  o   o  \</text>
    <text x="600" y="72">( ==  ^  == )</text>
    <text x="600" y="94">(__)___(__)</text>
  </g>

  <g class="ink" text-anchor="middle">
    <text x="600" y="158" font-size="26" font-weight="700" letter-spacing="2">laraib.exe</text>
    <text x="600" y="210" font-size="22">builds    ›  software with a purpose</text>
    <text x="600" y="246" font-size="22">explores  ›  AI for real-world problems</text>
    <text x="600" y="282" font-size="22">brings    ›  technical + creative thinking</text>
    <text x="600" y="318" font-size="22">powered   ›  curiosity and horror games</text>
    <text x="600" y="348" font-size="15" letter-spacing="7">✦  ·  ✦  ·  ✦</text>
  </g>
</svg>
